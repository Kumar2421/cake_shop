<!--
  Sign-in code email.

  The storefront uses a 6-digit OTP typed into a modal, not a magic link, so
  this template must render {{ .Token }}. Swapping it back to {{ .ConfirmationURL }}
  would silently break the login dialog.
-->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #070707;">
  <div style="background: #fc0015; border-radius: 8px; padding: 12px 16px; display: inline-block;">
    <span style="color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: -0.5px;">bakingo</span>
  </div>

  <h1 style="font-size: 20px; font-weight: 600; margin: 28px 0 8px;">Your sign-in code</h1>
  <p style="font-size: 14px; color: #515151; margin: 0 0 24px;">
    Enter this code to finish signing in. It expires in 10 minutes.
  </p>

  <div style="background: #ffe8ee; border-radius: 12px; padding: 20px; text-align: center;">
    <span style="font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #fc0015;">{{ .Token }}</span>
  </div>

  <p style="font-size: 13px; color: #515151; margin: 24px 0 0;">
    If you did not request this code, you can ignore this email — nobody can sign in without it.
  </p>
</div>
